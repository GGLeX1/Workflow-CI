name: MLflow CI - Re-train Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-publish:
    name: Train MLflow Model and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('MLProject/conda.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mlflow==2.19.0 \
            cloudpickle==2.2.1 \
            lz4==4.3.2 \
            numpy==1.26.4 \
            pandas==2.2.3 \
            psutil==5.9.0 \
            scikit-learn==1.5.2 \
            scipy==1.14.1 \
            matplotlib

      - name: Verify MLflow installation
        run: |
          mlflow --version
          python -c "import sklearn, pandas, numpy, matplotlib; print('All dependencies OK')"

      - name: Run MLflow Project
        working-directory: ./MLProject
        run: |
          mlflow run . --env-manager=local

      - name: Get MLflow Run ID
        id: get_run_id
        working-directory: ./MLProject
        run: |
          RUN_ID=$(ls -t mlruns/0/ | grep -v "meta.yaml\|datasets" | head -n 1)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Captured RUN_ID: $RUN_ID"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build MLflow Docker Image
        working-directory: ./MLProject
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.get_run_id.outputs.RUN_ID }}/model" \
            --name "${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model"

      - name: Tag image
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:${{ github.sha }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:${{ github.sha }}

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-artifacts-${{ github.sha }}
          path: |
            MLProject/mlruns/
            MLProject/*.png
          retention-days: 30

      - name: Training summary
        if: always()
        run: |
          echo "## 🎯 MLflow Training & Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**MLflow Run ID**: ${{ steps.get_run_id.outputs.RUN_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pull command**: \`docker pull ${{ secrets.DOCKERHUB_USERNAME }}/msft-volatility-model:latest\`" >> $GITHUB_STEP_SUMMARY
